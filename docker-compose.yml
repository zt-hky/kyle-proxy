# Pull the published multi-architecture image from GitHub Container Registry.
# Override GHCR_IMAGE to pin a version or use a private package after `docker login ghcr.io`.
services:
  globalprotect-manager:
    image: ${GHCR_IMAGE:-ghcr.io/zt-hky/globalprotect-manager:latest}
    restart: unless-stopped
    stop_grace_period: 25s

    ports:
      - "8888:8888" # Web management UI

    # Required for the GlobalProtect TUN interface and gpclient.
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      - globalprotect-manager-data:/data

    environment:
      CONFIG_PATH: /data/config.json
      LISTEN_ADDR: :8888
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      TELEGRAM_ACCESS_PATH: ${TELEGRAM_ACCESS_PATH:-/data/telegram-access.json}

    networks:
      - vpn

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2"
        reservations:
          memory: 64M

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Start with `docker compose --profile vpn-client up -d`. This service shares
  # the VPN container's network namespace, so every process launched inside it
  # uses the GlobalProtect routes after the VPN connects:
  #   docker compose exec vpn-client wget -qO- https://ifconfig.me
  # For a real workload, copy this service and replace image/command; do not add
  # `networks`, because network_mode and networks are mutually exclusive.
  vpn-client:
    image: alpine:3.21
    profiles: ["vpn-client"]
    restart: unless-stopped
    network_mode: "service:globalprotect-manager"
    depends_on:
      globalprotect-manager:
        condition: service_healthy
    command: ["sleep", "infinity"]

volumes:
  globalprotect-manager-data:
    name: globalprotect-manager-data
    driver: local

networks:
  # Dedicated bridge for the VPN namespace. Workloads that must traverse the
  # VPN join it by sharing the manager namespace via network_mode above.
  vpn:
    name: globalprotect-vpn
    driver: bridge
